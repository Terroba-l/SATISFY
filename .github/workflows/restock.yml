name: SATISFY restock monitor

on:
  # Auto-schedule désactivé : le compte GitHub est verrouillé (billing) et chaque
  # run planifié échoue en ~3 s sans runner, ce qui spammait des notifications.
  # Pour réactiver une fois la facturation débloquée, dé-commente le bloc ci-dessous.
  # schedule:
  #   # Toutes les 15 minutes (le cron GitHub n'est pas garanti à la minute près).
  #   - cron: "*/15 * * * *"
  workflow_dispatch: {}  # exécution manuelle depuis l'onglet Actions

# Nécessaire pour recommiter state.json dans le repo.
permissions:
  contents: write

concurrency:
  # Évite deux exécutions concurrentes qui se battraient sur state.json.
  group: restock-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Run restock check
        env:
          PRODUCT_URLS: ${{ vars.PRODUCT_URLS }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ vars.NTFY_SERVER }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
        run: python check.py

      - name: Commit state changes
        run: |
          if [[ -n "$(git status --porcelain state.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "chore: update restock state [skip ci]"
            # Rebase au cas où une autre exécution aurait poussé entre-temps.
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "Aucun changement d'état à commiter."
          fi
